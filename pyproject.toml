[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-bot"
version = "0.1.0"
description = "Risk-managed trading bot for Kalshi prediction markets"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "cryptography>=42.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]
finetune = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.19",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
include = ["kalshi_bot*"]

[tool.setuptools.package-data]
kalshi_bot = ["static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
